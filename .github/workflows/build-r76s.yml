name: Build iStoreOS for NanoPi R76S

on:
  workflow_dispatch:
  push:
    branches:
      - istoreos-25.12

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build NanoPi R76S Firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo systemctl stop docker.socket docker.service || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/lib/jvm \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/aws-cli \
            /usr/local/google-cloud-sdk \
            /var/lib/docker
          sudo apt-get clean
          df -h
          free -h

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev python3-pyelftools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libfuse-dev python3-setuptools g++ file clang genisoimage
          python3 -m pip install --break-system-packages pyelftools || true
          sudo apt-get clean

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate R76S Configuration
        run: |
          cp -f r76s.config.seed .config
          make defconfig
          echo -n 5eacf764ba9415e5d7ff4aecb2e45c4d > .vermagic
          grep -E "CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|friendlyarm_nanopi-r76s|CONFIG_PACKAGE_kmod-r8125|CONFIG_PACKAGE_quickstart|CONFIG_KERNEL_DEBUG_INFO" .config

      - name: Download Package Sources
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
          df -h

      - name: Compile Firmware
        id: compile
        run: |
          date '+%Y%m%d%H' > version
          echo "Building firmware with $(nproc) threads (lowered CPU/IO priority to protect runner agent)..."
          nice -n 10 ionice -c 2 -n 7 make -j$(nproc) || nice -n 10 ionice -c 2 -n 7 make -j1 V=s
          df -h
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Firmware Output
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/rockchip/armv8
          rm -rf packages kmods
          find . -maxdepth 1 -type d ! -name '.' -exec rm -rf {} +
          VER=$(cat ../../../../version 2>/dev/null || date '+%Y%m%d%H')
          SRC=$(ls *nanopi-r76s-squashfs-sysupgrade.img.gz)
          OUT=istoreos-25.12.6-${VER}-r76s
          mkdir -p ../out

          # mainline U-Boot 2025.10, also usable for web sysupgrade
          cp -a "$SRC" "../out/${OUT}-mainline-uboot-squashfs.img.gz"

          cd ../out
          cp -a ../armv8/*.manifest ../armv8/config.buildinfo . 2>/dev/null || true
          sha256sum *.img.gz > sha256sums.txt
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: iStoreOS-25.12-NanoPi-R76S-Firmware
          path: ${{ env.FIRMWARE }}/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          tag_name: v25.12-r76s-${{ github.run_number }}
          name: iStoreOS 25.12.6 for FriendlyElec NanoPi R76S (Build #${{ github.run_number }})
          body: |
            ### iStoreOS 25.12.6 for NanoPi R76S（正式版）

            基于 iStoreOS 25.12.6，包含 RK3576 电源域修复、eMMC HS400ES/CQE BSP 调优、r8125 headroom 与 RTL9210 UAS 修复。

            | 文件 | 引导程序 | 用途 |
            | :--- | :--- | :--- |
            | `*-mainline-uboot-squashfs.img.gz` | 主线 U-Boot 2025.10 | RKDevTool 线刷；网页升级也可（不改引导区） |

            - eMMC：HS400 Enhanced Strobe + CQE 启用；FORESEE A3A551 实机 2GB direct read 264.5MB/s，无 I/O/SQUASHFS 错误。
            - 内核参数：`usbcore.autosuspend=-1`；无诊断日志、无 ramoops。
            - 从 24.10 跨大版本升级时**不要保留配置**。
          files: ${{ env.FIRMWARE }}/*
