name: Build iStoreOS for NanoPi R76S

on:
  workflow_dispatch:
  push:
    branches:
      - istoreos-25.12

permissions:
  contents: write

jobs:
  build:
    name: Build NanoPi R76S Firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          df -h

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev python3-pyelftools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev libfuse-dev python3-setuptools g++ file clang genisoimage
          python3 -m pip install --break-system-packages pyelftools || true

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate R76S Configuration
        run: |
          cp -f r76s.config.seed .config
          make defconfig
          echo -n 5eacf764ba9415e5d7ff4aecb2e45c4d > .vermagic
          grep -E "CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|friendlyarm_nanopi-r76s|CONFIG_PACKAGE_kmod-r8125|CONFIG_PACKAGE_quickstart" .config

      - name: Download Package Sources
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        id: compile
        run: |
          date '+%Y%m%d%H' > version
          echo "Building firmware with $(nproc) threads..."
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Firmware Output
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd bin/targets/rockchip/armv8
          rm -rf packages kmods
          find . -maxdepth 1 -type d ! -name '.' -exec rm -rf {} +
           VER=$(cat ../../../../version 2>/dev/null || date '+%Y%m%d%H')
          for f in *nanopi-r76s-squashfs-sysupgrade.img.gz; do
            if [ -f "$f" ]; then
              cp -a "$f" "istoreos-25.12.6-${VER}-r76s-squashfs.img.gz"
            fi
          done
          sha256sum *.img.gz > sha256sums.txt || true
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: iStoreOS-25.12-NanoPi-R76S-Firmware
          path: ${{ env.FIRMWARE }}/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          tag_name: v25.12-r76s-${{ github.run_number }}
          name: iStoreOS 25.12.6 for FriendlyElec NanoPi R76S (Build #${{ github.run_number }})
          body: |
            ### iStoreOS 25.12.6 (NanoPi R76S 满血修复版线刷固件)
            
            - **适用设备**：FriendlyElec NanoPi R76S (瑞芯微 RK3576)
            - **底层基准**：100% 同步官方 `dl.istoreos.com/iStoreOS/r76s/feeds.conf` 与 `config.seed`（64MB Kernel 分区 + 256MB RootFS 分区 + 完整内置 iStore、QuickStart、Docker、Samba4、DiskMan 等官方套件）
            - **核心修复补丁**：
              1. **eMMC 线刷防卡死**：修复主线 U-Boot 2025.10 对江波龙 FORESEE A3A551 等 eMMC 芯片 HS200/HS400 动态 CMD21 调谐失败（`-5`）导致线刷无法启动的问题（U-Boot 阶段限速 52MHz 稳定引导，进入 Linux 6.12 后恢复 HS400 全速）；
              2. **2.5G 网卡防崩溃**：合入 FriendlyARM 针对 Realtek `r8125 9.016.01` 在网桥/Docker `br_netfilter` 场景下因 RX skb headroom 不足引发内核 Oops 死机的修复补丁；
              3. **外接硬盘盒防掉盘**：内核级 `unusual_uas.h` 针对 `RTL9210/RTL9210B (0bda:9210)` 等主控标记 `US_FL_IGNORE_UAS` 强制走高稳定 BOT 传输模式，并配合系统级关闭 USB 自动休眠（`autosuspend=-1`）。
            - **刷机说明**：下载 `.img.gz` 后既可直接用于 iStoreOS 后台 OTA/保留配置升级，也可解压得到 `.img` 使用 RKDevTool 线刷至 eMMC。
          files: ${{ env.FIRMWARE }}/*
